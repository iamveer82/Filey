name: filey-erp release build

# Builds signed-or-unsigned desktop installers for macOS, Windows and Linux.
# Trigger: push a tag like `filey-erp-v1.0.0`, or run manually.
on:
  push:
    tags:
      - "filey-erp-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential \
            libssl-dev libxdo-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: filey-erp/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: filey-erp/src-tauri

      - name: Install dependencies
        working-directory: filey-erp
        run: npm ci

      - name: Typecheck & unit tests
        working-directory: filey-erp
        run: |
          npm run typecheck
          npm test

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: filey-erp
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && 'Filey ERP ${{ github.ref_name }}' || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing — populate these repo secrets to ship signed builds.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filey-erp-${{ matrix.os }}
          path: |
            filey-erp/src-tauri/target/**/release/bundle/**/*.dmg
            filey-erp/src-tauri/target/**/release/bundle/**/*.app
            filey-erp/src-tauri/target/**/release/bundle/**/*.AppImage
            filey-erp/src-tauri/target/**/release/bundle/**/*.deb
            filey-erp/src-tauri/target/**/release/bundle/**/*.rpm
            filey-erp/src-tauri/target/**/release/bundle/**/*.msi
            filey-erp/src-tauri/target/**/release/bundle/**/*.exe
          if-no-files-found: ignore
