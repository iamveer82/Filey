name: filey-erp CI

on:
  push:
    paths:
      - "filey-erp/**"
      - ".github/workflows/filey-erp.yml"
  pull_request:
    paths:
      - "filey-erp/**"
      - ".github/workflows/filey-erp.yml"

defaults:
  run:
    working-directory: filey-erp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: filey-erp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
